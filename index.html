<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lupa</title>
<meta name="description" content="Lupa: Sammle die Säugetiere Deutschlands. Sichtungen mit Datum, Ort und Fotos.">
<meta name="theme-color" content="#f2f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c110e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lupa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@1,6..72,400&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: collector's app. Dark hero card with a ring of eight order colors, colored order cards, badge shelf,
   photo album grid, bottom sheets for species/capture, fixed tab bar. Each order owns one bold color. */
:root {
  --bg: #f2f5f3;
  --surface: #ffffff;
  --surface-2: #e8eeea;
  --ink: #121a16;
  --muted: #5d6a63;
  --line: #dbe2dd;
  --accent: #17924f;
  --accent-ink: #ffffff;
  --hero: #13201a;
  --hero-ink: #f2f7f3;
  --hero-muted: #9fb3a7;
  --ex: #9b6864;
  --example: #a77f0c;
  --danger: #c0392b;
  --rl-1: #c0392b;
  --rl-2: #d0612a;
  --rl-3: #b07a12;
  --c-erinaceomorpha: #b07a12;
  --c-soricomorpha: #7d4e9e;
  --c-chiroptera: #3d4db0;
  --c-lagomorpha: #d0612a;
  --c-rodentia: #2a8a7c;
  --c-carnivora: #c73e4a;
  --c-ungulata: #4b8a2c;
  --c-cetacea: #1f7bb8;
  --scrim: rgba(8, 14, 10, .5);
  --shadow: 0 12px 32px rgba(18, 26, 22, .16);
  --f-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-latin: "Newsreader", Georgia, "Times New Roman", serif;
  --f-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c110e; --surface: #151c18; --surface-2: #1e2722; --ink: #e8eeea; --muted: #95a39b; --line: #26302b;
    --accent: #3cc27a; --accent-ink: #06140c; --hero: #18241e; --hero-ink: #f2f7f3; --hero-muted: #9fb3a7;
    --ex: #c4918c; --example: #e2bf55; --danger: #ec7a66; --rl-1: #ef7c69; --rl-2: #ef9b5e; --rl-3: #e2bf55;
    --c-erinaceomorpha: #c08a1e; --c-soricomorpha: #9363b5; --c-chiroptera: #5868cc; --c-lagomorpha: #e07238;
    --c-rodentia: #2f9d8d; --c-carnivora: #d9505c; --c-ungulata: #5a9e37; --c-cetacea: #2b8fd0;
    --scrim: rgba(0, 0, 0, .62); --shadow: 0 12px 32px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c110e; --surface: #151c18; --surface-2: #1e2722; --ink: #e8eeea; --muted: #95a39b; --line: #26302b;
  --accent: #3cc27a; --accent-ink: #06140c; --hero: #18241e; --hero-ink: #f2f7f3; --hero-muted: #9fb3a7;
  --ex: #c4918c; --example: #e2bf55; --danger: #ec7a66; --rl-1: #ef7c69; --rl-2: #ef9b5e; --rl-3: #e2bf55;
  --c-erinaceomorpha: #c08a1e; --c-soricomorpha: #9363b5; --c-chiroptera: #5868cc; --c-lagomorpha: #e07238;
  --c-rodentia: #2f9d8d; --c-carnivora: #d9505c; --c-ungulata: #5a9e37; --c-cetacea: #2b8fd0;
  --scrim: rgba(0, 0, 0, .62); --shadow: 0 12px 32px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  padding-block: 0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.app { max-width: 540px; margin: 0 auto; }
.latin { font-family: var(--f-latin); font-style: italic; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.press { transition: transform .12s ease; }
.press:active { transform: scale(.97); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 24px; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
.brand .logo { width: 32px; height: 32px; flex: none; }
.scope { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface); border: 1px solid var(--line); padding: 4px 10px; border-radius: 99px; }

.banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; border: 1.5px dashed var(--example); border-radius: 14px; padding: 10px 12px; margin-block: 2px 14px; font-size: 13px; }
.banner button { font-weight: 700; color: var(--example); white-space: nowrap; }

section { margin-top: 28px; }
.sh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0 0 12px; }
.sh h2 { font-family: var(--f-display); font-weight: 800; font-size: 21px; letter-spacing: -.01em; margin: 0; }
.sh small, .sh button { font-size: 13px; color: var(--muted); font-weight: 600; }
.sh button { color: var(--accent); }

/* Hero */
.hero { background: var(--hero); color: var(--hero-ink); border-radius: 26px; padding: 20px; display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; position: relative; overflow: hidden; }
.ring { position: relative; width: 148px; height: 148px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .big { font-family: var(--f-display); font-weight: 800; font-size: 50px; line-height: .9; letter-spacing: -.03em; }
.ring .of { font-family: var(--f-data); font-size: 12px; color: var(--hero-muted); margin-top: 4px; }
.hero h1 { font-family: var(--f-display); font-weight: 700; font-size: 20px; line-height: 1.15; margin: 0 0 4px; text-wrap: balance; }
.hero .pct { font-family: var(--f-display); font-weight: 800; font-size: 34px; letter-spacing: -.02em; color: var(--hero-ink); line-height: 1; }
.hero .pct small { font-size: 15px; font-weight: 600; color: var(--hero-muted); margin-left: 4px; letter-spacing: 0; }
.stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: rgba(255,255,255,.07); border-radius: 14px; padding: 10px 12px; min-width: 0; text-align: left; }
.stat b { display: block; font-family: var(--f-display); font-weight: 800; font-size: 22px; line-height: 1.1; }
.stat span { font-size: 12px; color: var(--hero-muted); }
.stat.ex b { color: #e3b2ad; }
@media (max-width: 370px) { .hero { grid-template-columns: 1fr; justify-items: center; text-align: center; } }

/* Badges */
.shelf { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; margin-inline: calc(-1 * var(--gutter-l)) calc(-1 * var(--gutter-r)); padding: 2px var(--gutter-r) 6px var(--gutter-l); }
.shelf::-webkit-scrollbar { display: none; }
.badge { flex: none; width: 84px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.medal { width: 68px; height: 68px; border-radius: 50%; display: grid; place-items: center; position: relative; color: #fff; background: var(--bc, var(--accent)); box-shadow: inset 0 -4px 0 rgba(0,0,0,.18), 0 4px 10px rgba(0,0,0,.12); }
.medal::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; border: 2px dashed rgba(255,255,255,.45); }
.medal .g { font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -.02em; }
.medal .g.sm { font-size: 17px; }
.medal svg.sil { width: 46px; height: auto; }
.medal svg.sil .sil-line { stroke: none; }
.medal svg.sil .sil-empty, .medal svg.sil .sil-fill { fill: #fff; }
.medal svg.sil .sil-ground { stroke: none; }
.medal svg.ic { width: 28px; height: 28px; }
.badge.locked .medal { background: var(--surface-2); color: var(--muted); box-shadow: none; }
.badge.locked .medal::after { border-color: var(--line); }
.badge.locked .medal svg.sil .sil-empty, .badge.locked .medal svg.sil .sil-fill { fill: var(--muted); opacity: .45; }
.badge .bn { font-size: 12px; font-weight: 700; line-height: 1.2; }
.badge .bp { font-family: var(--f-data); font-size: 11px; color: var(--muted); }
.badge .bar { width: 56px; height: 4px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.badge .bar i { display: block; height: 100%; background: var(--bc, var(--accent)); }

/* Order cards */
.ocards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ocard { background: var(--oc); color: #fff; border-radius: 20px; padding: 12px 12px 14px; text-align: left; display: flex; flex-direction: column; gap: 6px; min-width: 0; position: relative; }
.ocard svg { width: 100%; height: auto; aspect-ratio: 120 / 80; max-width: 100%; display: block; }
.ocard .sil-line { stroke: rgba(255,255,255,.9); stroke-width: 2.4; fill: none; opacity: 1; stroke-linejoin: round; }
.ocard .sil-empty { fill: rgba(255,255,255,.16); }
.ocard .sil-fill { fill: #fff; }
.ocard .sil-ground { stroke: rgba(255,255,255,.35); stroke-width: 1.5; }
.ocard .orow { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 6px; }
.ocard .oname { font-family: var(--f-display); font-weight: 700; font-size: 16px; line-height: 1.1; min-width: 0; }
.ocard .ocount { font-family: var(--f-data); font-size: 12px; font-weight: 600; opacity: .9; white-space: nowrap; }
.ocard .odots { display: flex; flex-wrap: wrap; gap: 3px; }
.ocard .odots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.28); }
.ocard .odots i.on { background: #fff; }
.ocard .odots i.ex { background: transparent; border: 1px dashed rgba(255,255,255,.6); }
.ocard .odots i.ex.on { background: #e3b2ad; border: 0; }
.ocard .done { position: absolute; top: 10px; right: 10px; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: #fff; color: var(--oc); padding: 2px 7px; border-radius: 99px; }

/* Recent cards */
.recent { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin-inline: calc(-1 * var(--gutter-l)) calc(-1 * var(--gutter-r)); padding: 2px var(--gutter-r) 4px var(--gutter-l); }
.recent::-webkit-scrollbar { display: none; }
.rcard { flex: none; width: 148px; background: var(--surface); border-radius: 18px; overflow: hidden; text-align: left; border: 1px solid var(--line); }
.rcard .rph { aspect-ratio: 1; position: relative; background: var(--surface-2); }
.rcard .rph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.rcard .rph .own { position: absolute; left: 8px; bottom: 8px; font-size: 10px; font-weight: 700; background: rgba(0,0,0,.6); color: #fff; padding: 2px 7px; border-radius: 99px; }
.rcard .rb { padding: 8px 10px 10px; border-top: 4px solid var(--oc); }
.rcard strong { display: block; font-size: 14px; line-height: 1.2; }
.rcard span { font-size: 12px; color: var(--muted); }

.empty { padding: 24px 16px; text-align: center; color: var(--muted); font-size: 14px; background: var(--surface); border: 1.5px dashed var(--line); border-radius: 18px; }
.foot { margin-top: 30px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.foot button { text-decoration: underline; text-underline-offset: 2px; text-align: left; }

/* Tags & RL */
.tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--example); border: 1px solid var(--example); border-radius: 5px; padding: 0 4px; margin-left: 6px; vertical-align: 2px; }
.tag.ex { color: var(--ex); border-color: var(--ex); }
.tag.new { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.rl { display: inline-flex; align-items: center; font-family: var(--f-data); font-size: 10.5px; font-weight: 600; line-height: 1; padding: 3px 6px; border-radius: 6px; background: var(--surface); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.rl[data-rl="1"] { background: var(--rl-1); border-color: var(--rl-1); color: #fff; }
.rl[data-rl="2"] { background: var(--rl-2); border-color: var(--rl-2); color: #fff; }
.rl[data-rl="3"] { background: var(--rl-3); border-color: var(--rl-3); color: #fff; }
.rl[data-rl="0"] { background: var(--ex); border-color: var(--ex); color: #fff; }
.rl[data-rl="*"] { color: var(--accent); border-color: var(--accent); }

/* Species album */
.search { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 56px); z-index: 4; background: var(--bg); padding-block: 2px 10px; display: flex; flex-direction: column; gap: 8px; }
.search input { width: 100%; font: inherit; font-size: 16px; padding: 12px 16px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
.search input:focus { outline: none; border-color: var(--accent); }
.hscroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: calc(-1 * var(--gutter-l)) calc(-1 * var(--gutter-r)); padding-inline: var(--gutter-l) var(--gutter-r); }
.hscroll::-webkit-scrollbar { display: none; }
.chip { flex: none; font-size: 13px; font-weight: 600; padding: 6px 13px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .sw { width: 10px; height: 10px; border-radius: 50%; background: var(--oc); }
.chip.o[aria-pressed="true"] { background: var(--oc); border-color: var(--oc); color: #fff; }
.chip.o[aria-pressed="true"] .sw { background: #fff; }
.chip .n { font-family: var(--f-data); font-size: 11px; opacity: .75; }
.group { margin-top: 20px; }
.ghead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.ghead .gt { display: inline-flex; align-items: center; gap: 8px; background: var(--oc); color: #fff; font-family: var(--f-display); font-weight: 700; font-size: 15px; padding: 5px 12px 5px 6px; border-radius: 99px; }
.ghead .gt svg { width: 30px; height: 20px; }
.ghead .gt .sil-line { stroke: none; } .ghead .gt .sil-ground { stroke: none; }
.ghead .gt .sil-empty, .ghead .gt .sil-fill { fill: #fff; }
.ghead .gc { font-family: var(--f-data); font-size: 12px; color: var(--muted); }
.ghead .gbar { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.ghead .gbar i { display: block; height: 100%; background: var(--oc); border-radius: 99px; }
.album { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 480px) { .album { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { text-align: left; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.tile .tp { aspect-ratio: 1; max-width: 100%; border-radius: 16px; overflow: hidden; position: relative; background: var(--surface-2); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 26px; color: var(--muted); }
.tile .tp img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(.85); transition: filter .3s; }
.tile:not(.seen) .tp::after { content: ""; position: absolute; inset: 0; background: var(--bg); opacity: .42; z-index: 1; }
.tile .tp .rl, .tile .ck, .tile .cnt { z-index: 2; }
.tile.seen .tp { box-shadow: 0 0 0 3px var(--oc); }
.tile.seen .tp img { filter: none; }
.tile.ex .tp { outline: 2px dashed var(--ex); outline-offset: -2px; }
.tile.ex.seen .tp { box-shadow: 0 0 0 3px var(--ex); outline: 0; }
.tile .ck { position: absolute; right: 6px; bottom: 6px; width: 24px; height: 24px; border-radius: 50%; background: var(--oc); color: #fff; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.tile.ex .ck { background: var(--ex); }
.tile .ck svg { width: 14px; height: 14px; }
.tile .cnt { position: absolute; left: 6px; bottom: 6px; font-family: var(--f-data); font-size: 10px; font-weight: 600; background: rgba(0,0,0,.6); color: #fff; padding: 1px 6px; border-radius: 99px; }
.tile .tp .rl { position: absolute; left: 6px; top: 6px; }
.tile .tn { font-size: 12.5px; font-weight: 600; line-height: 1.2; hyphens: auto; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile:not(.seen) .tn { color: var(--muted); font-weight: 500; }

/* Log */
.month { margin-top: 22px; }
.mhead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; gap: 8px; }
.mhead h2 { font-family: var(--f-display); font-weight: 800; font-size: 20px; margin: 0; }
.mhead span { font-size: 12px; color: var(--muted); font-weight: 600; }
.entries { display: flex; flex-direction: column; gap: 8px; }
.entry { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 8px; padding-right: 14px; text-align: left; width: 100%; background: var(--surface); border-radius: 18px; border: 1px solid var(--line); position: relative; overflow: hidden; }
.entry::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--oc); }
.entry .eph { width: 64px; height: 64px; border-radius: 13px; overflow: hidden; position: relative; background: var(--surface-2); }
.entry .eph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.entry .eph b { position: absolute; right: 4px; bottom: 4px; font-size: 10px; font-weight: 700; background: rgba(0,0,0,.6); color: #fff; border-radius: 99px; padding: 0 5px; }
.entry .what { min-width: 0; }
.entry .what strong { font-weight: 700; display: block; line-height: 1.25; }
.entry .where { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.entry .day { font-family: var(--f-data); text-align: center; line-height: 1.05; }
.entry .day b { display: block; font-size: 19px; font-weight: 600; }
.entry .day span { font-size: 10px; color: var(--muted); text-transform: uppercase; }

/* Bottom nav + FAB */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 6px var(--gutter-r) calc(6px + env(safe-area-inset-bottom, 0px)) var(--gutter-l); }
nav.tabs .inner { max-width: 540px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: calc(var(--nav-h) - 12px); }
nav.tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--muted); font-weight: 600; }
nav.tabs button svg { width: 23px; height: 23px; }
nav.tabs button[aria-current="page"] { color: var(--ink); }
nav.tabs button[aria-current="page"] svg { color: var(--accent); }
.fab { position: fixed; z-index: 15; right: calc(var(--gutter-r) + 2px); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 14px 20px 14px 16px; font-weight: 700; font-size: 16px; display: flex; gap: 6px; align-items: center; box-shadow: var(--shadow); }
@media (min-width: 572px) { .fab { right: calc(50% - 270px + 2px); } }
.fab svg { width: 20px; height: 20px; }

/* Sheet */

/* ---------- Own photos: IndexedDB, downscaled JPEG blobs ---------- */
const memPhotos = new Map();   // fallback when IndexedDB is unavailable
const urlCache = new Map();
let dbp = null;
function idb() {
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    try {
      const r = indexedDB.open("tierbuch-fotos", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("fotos");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
  return dbp;
}
async function putPhoto(id, blob) {
  try { const db = await idb(); await new Promise((res, rej) => { const tx = db.transaction("fotos", "readwrite"); tx.objectStore("fotos").put(blob, id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
  catch (e) { memPhotos.set(id, blob); }
}
async function getPhoto(id) {
  if (memPhotos.has(id)) return memPhotos.get(id);
  try { const db = await idb(); return await new Promise((res, rej) => { const r = db.transaction("fotos").objectStore("fotos").get(id); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); }); }
  catch (e) { return null; }
}
async function delPhoto(id) {
  memPhotos.delete(id);
  if (urlCache.has(id)) { URL.revokeObjectURL(urlCache.get(id)); urlCache.delete(id); }
  try { const db = await idb(); db.transaction("fotos", "readwrite").objectStore("fotos").delete(id); } catch (e) {}
}
async function photoURL(id) {
  if (urlCache.has(id)) return urlCache.get(id);
  const b = await getPhoto(id);
  if (!b) return null;
  const u = URL.createObjectURL(b); urlCache.set(id, u); return u;
}
/* fill every <img data-foto="id"> currently in the DOM */
function hydratePhotos(root = document) {
  root.querySelectorAll("img[data-foto]:not([src])").forEach(async img => {
    const u = await photoURL(img.dataset.foto);
    if (u) img.src = u; else img.closest("button, .t")?.setAttribute("data-missing", "");
  });
}
async function downscale(file, max = 1600) {
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch (e) {
    bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  }
  const w = bmp.width, h = bmp.height, k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(res => c.toBlob(b => res(b || file), "image/jpeg", 0.85));
}

/* ---------- EXIF: capture date and GPS from JPEG photos ---------- */
async function readExif(file) {
  try {
    const buf = await file.slice(0, 256 * 1024).arrayBuffer();
    const v = new DataView(buf);
    if (v.getUint16(0) !== 0xFFD8) return null;
    let o = 2;
    while (o + 4 < v.byteLength) {
      const marker = v.getUint16(o), len = v.getUint16(o + 2);
      if (marker === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) return parseTiff(v, o + 10);
      if ((marker & 0xFF00) !== 0xFF00) break;
      o += 2 + len;
    }
  } catch (e) {}
  return null;
}

        ${GROUPS.map(g => { const obs = g.arten.filter(s => !s.ex); return `<button type="button" class="chip o" style="--oc:${oc(g.id)}" data-order="${g.id}" aria-pressed="${order === g.id}"><span class="sw"></span>${g.name}<span class="n num">${obs.filter(s => m[s.id]).length}/${obs.length}</span></button>`; }).join("")}
      </div>
    </div>
    ${groupsHTML || `<div class="empty" style="margin-top:16px">Keine Art passt zu diesen Filtern${query ? ` und „${esc(query)}“` : ""}.</div>`}`;
  if (hadFocus) { const i = document.getElementById("q"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  const ob = view.querySelector(".orderbar");
  if (ob) { ob.scrollLeft = orderScroll; const a = ob.querySelector('[aria-pressed="true"]'); if (a && (a.offsetLeft < ob.scrollLeft || a.offsetLeft + a.offsetWidth > ob.scrollLeft + ob.clientWidth)) ob.scrollLeft = a.offsetLeft - 16; }
}

function entryHTML(s, firsts) {
  const sp = SPECIES[s.artId], d = new Date(s.ts), f = s.fotos || [];
  return `<button class="entry press" type="button" style="--oc:${oc(sp.gid)}" data-open="${s.artId}">
    <div class="eph">${f.length ? `<img data-foto="${f[0]}" alt="">${f.length > 1 ? `<b>${f.length}</b>` : ""}` : speciesImg(sp)}</div>
    <div class="what"><strong>${esc(sp.name)}${firsts.has(s.id) ? '<span class="tag new">Neu</span>' : ""}${sp.ex ? '<span class="tag ex">Bonus</span>' : ""}${s.beispiel ? '<span class="tag">Beispiel</span>' : ""}</strong>
      <div class="where">${esc(s.ort || fmtCoords(s.lat, s.lon) || "Ort unbekannt")}</div></div>
    <div class="day"><b class="num">${d.getDate()}</b><span>${d.toLocaleDateString("de-DE", { month: "short" }).replace(".", "")}</span></div>
  </button>`;
}
function renderLog() {
  const list = state.sightings.slice().sort((a, b) => b.ts - a.ts);
  if (!list.length) { view.innerHTML = `<div class="empty" style="margin-top:12px">Dein Logbuch ist leer. Jede Sichtung erscheint hier mit Datum, Ort und Fotos.</div>`; return; }
  const firsts = firstSightingIds();
  const months = [];
  list.forEach(s => {
    const k = new Date(s.ts).toLocaleDateString("de-DE", { month: "long", year: "numeric" });
    if (!months.length || months[months.length - 1][0] !== k) months.push([k, []]);
    months[months.length - 1][1].push(s);
  });
  view.innerHTML = bannerHTML() + months.map(([k, items]) => {
    const neu = items.filter(s => firsts.has(s.id)).length;
    return `<div class="month"><div class="mhead"><h2>${k}</h2><span class="num">${items.length} ${items.length === 1 ? "Sichtung" : "Sichtungen"}${neu ? ` · ${neu} neue ${neu === 1 ? "Art" : "Arten"}` : ""}</span></div>
      <div class="entries">${items.map(s => entryHTML(s, firsts)).join("")}</div></div>`;
  }).join("");
  hydratePhotos(view);
}

function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => { if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  document.getElementById("fab").hidden = tab === "species";
  ({ overview: renderOverview, species: renderSpecies, log: renderLog })[tab]();
}
function go(t, opts = {}) {
  tab = t; render(); window.scrollTo(0, 0);
  if (opts.focusSearch) setTimeout(() => document.getElementById("q")?.focus(), 30);
}

/* ---------- Sheets ---------- */
const sheetRoot = document.getElementById("sheetRoot");
let lastFocus = null;
function closeSheet() { sheetRoot.innerHTML = ""; document.body.style.overflow = ""; draft = null; if (lastFocus) lastFocus.focus?.(); }
function shell(inner, gid) {
  if (!sheetRoot.innerHTML) lastFocus = document.activeElement;
  sheetRoot.innerHTML = `<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" style="--oc:${gid ? oc(gid) : "var(--accent)"}"><div class="sheet-head"><div class="grab"></div><button type="button" class="sheet-x" data-close aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>${inner}</div>`;
  document.body.style.overflow = "hidden";
}
function creditLine(s) {
  const c = s.credit;
  return `Foto: ${esc(c.urheber || "Urheber siehe Dateiseite")} · <a href="${esc(c.lizenzUrl || c.seite)}" target="_blank" rel="noopener">${esc(c.lizenz)}</a> · <a href="${esc(c.seite)}" target="_blank" rel="noopener">Wikimedia Commons</a>`;
}
const thumbsHTML = ids => `<div class="thumbs">${ids.map(f => `<button type="button" data-light="${f}" aria-label="Foto vergrößern"><img data-foto="${f}" alt=""></button>`).join("")}</div>`;

function openSpecies(id) {
  const sp = SPECIES[id];
  const list = byArt()[id] || [];
  const first = list.length ? list[list.length - 1] : null;
  const fotos = list.flatMap(s => s.fotos || []);
  shell(`
    <figure class="photo ${sp.ex ? "ex" : ""}">
      <div class="frame">${silhouette(sp.gid, 1)}${PHOTOS ? `<img src="img/${sp.id}.jpg" alt="${esc(sp.name)}" onerror="this.remove()">` : ""}
        ${list.length ? `<span class="stamp">${sp.ex ? "Bonus" : "Gesehen"}</span>` : ""}
        <span class="ordertag">${esc(sp.gname)}</span></div>
      <figcaption class="credit">${creditLine(sp)}</figcaption>
    </figure>
    <h2 class="t" id="sheetTitle">${esc(sp.name)}</h2>
    <div class="latin">${esc(sp.wiss)}</div>
    <div class="facts">
      <div class="fact"><span class="label">Rote Liste</span><b>${esc(RL_TEXT[sp.rl])}</b>${rlBadge(sp)}</div>
      <div class="fact"><span class="label">Status</span><b>${esc(STATUS_TEXT[sp.status] || "")}</b></div>
      <div class="fact"><span class="label">Erstmals gesehen</span><b>${first ? fmtDate(first.ts) : "Noch offen"}</b></div>
      <div class="fact"><span class="label">Sichtungen</span><b class="num">${list.length}</b></div>
    </div>
    ${sp.ex ? `<div class="note-ex">Gilt in Deutschland als ausgestorben oder verschollen. Du kannst eine Sichtung trotzdem eintragen, etwa aus einem Gehege oder von einem zugewanderten Tier. Sie zählt als Bonus außerhalb des Fortschritts.</div>` : ""}
    <button class="btn primary press" type="button" data-capture="${id}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      ${list.length ? "Weitere Sichtung erfassen" : "Als gesehen eintragen"}
    </button>
    ${fotos.length ? `<div class="sheet-list"><div class="label">Deine Fotos (${fotos.length})</div>${thumbsHTML(fotos)}</div>` : ""}
    ${list.length ? `<div class="sheet-list"><div class="label">${list.length} ${list.length === 1 ? "Sichtung" : "Sichtungen"}</div>
      ${list.map(s => `<div class="s-item">
        <div><div class="when">${fmtDate(s.ts)} · ${fmtTime(s.ts)}${s.beispiel ? '<span class="tag">Beispiel</span>' : ""}</div>
          <div>${esc(s.ort || "Ort nicht benannt")}</div>
          ${s.lat != null ? `<div class="coords">${fmtCoords(s.lat, s.lon)}</div>` : ""}</div>
        <button type="button" class="del" data-del="${s.id}">Löschen</button>
        ${s.notiz ? `<div class="note">${esc(s.notiz)}</div>` : ""}
        ${(s.fotos || []).length ? thumbsHTML(s.fotos) : ""}
      </div>`).join("")}</div>` : ""}
  `, sp.gid);
  hydratePhotos(sheetRoot);
  sheetRoot.querySelector(".btn.primary").focus();
}

/* Capture form with photo upload */
let draft = null;
function openForm(id) {
  const sp = SPECIES[id];
  draft = { artId: id, fotos: [], lat: null, lon: null, exifUsed: false };
  shell(`
    <div class="label">Neue Sichtung</div>
    <div class="mini">${PHOTOS ? `<img src="img/${sp.id}.jpg" alt="" onerror="this.remove()">` : `<span class="ph"></span>`}
      <div><h2 class="t" id="sheetTitle">${esc(sp.name)}</h2><div class="latin" style="font-size:15px">${esc(sp.wiss)}</div></div></div>
    <form id="capture">
      <label class="pick press" for="f-fotos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        Fotos hinzufügen
        <input id="f-fotos" type="file" accept="image/*" multiple>
      </label>
      <div class="thumbs" id="draftThumbs" hidden></div>
      <label for="f-when">Datum und Uhrzeit
        <input id="f-when" type="datetime-local" value="${toLocalInput(Date.now())}" required></label>
      <div class="gps warn" id="gpsBox"><strong>Ort ohne GPS</strong><span>Lädst du ein Handyfoto mit Standortdaten hoch, übernimmt die App Ort und Aufnahmezeit daraus. In der fertigen App kommt der Ort sonst direkt vom GPS.</span></div>
      <label for="f-ort">Ortsname
        <input id="f-ort" type="text" placeholder="z. B. Müritz-Nationalpark" autocomplete="off"></label>
      <label for="f-note">Notiz <span class="hint">optional</span>
        <textarea id="f-note" placeholder="Anzahl, Verhalten, Wetter …"></textarea></label>
      <div class="form-actions">
        <button type="button" class="btn ghost" data-back="${id}">Zurück</button>
        <button type="submit" class="btn primary press" id="saveBtn">Speichern</button>
      </div>
    </form>`, sp.gid);
  locateDevice();
}
function renderDraftThumbs() {
  const box = document.getElementById("draftThumbs"); if (!box) return;
  box.hidden = !draft.fotos.length;
  box.innerHTML = draft.fotos.map((f, i) => `<div class="t"><img src="${f.url}" alt=""><button type="button" class="x" data-rmfoto="${i}" aria-label="Foto entfernen">×</button></div>`).join("");
}
function setGps(lat, lon, source = "foto", acc) {
  if (!draft) return;
  draft.lat = lat; draft.lon = lon; draft.gpsSource = source;
  const b = document.getElementById("gpsBox"); if (!b) return;
  b.classList.remove("warn");
  b.innerHTML = `<strong>${source === "foto" ? "Ort aus Foto übernommen" : "Aktueller Standort erfasst"}</strong><span class="coordline">${fmtCoords(lat, lon)}${acc ? ` · ±${Math.round(acc)} m` : ""}</span>`;
}
/* Device GPS: works on a normal https page; inside a sandboxed preview it is refused and the hint stays */
function locateDevice() {
  const box = () => document.getElementById("gpsBox");
  const fail = () => {
    const b = box(); if (!b || !draft || draft.gpsSource) return;
    b.classList.add("warn");
    b.innerHTML = `<strong>Kein Standort verfügbar</strong><span>Erlaube den Standortzugriff, lade ein Foto mit Ortsdaten hoch oder trag den Ort unten von Hand ein.</span>`;
  };
  try {
    if (!navigator.geolocation) return fail();
    const b = box(); if (b) b.innerHTML = `<strong>Standort wird ermittelt …</strong><span>Dein Browser fragt eventuell nach der Erlaubnis.</span>`;
    const d = draft, timer = setTimeout(fail, 10000);
    navigator.geolocation.getCurrentPosition(p => {
      clearTimeout(timer);
      if (draft !== d || d.gpsSource === "foto") return;
      setGps(p.coords.latitude, p.coords.longitude, "geraet", p.coords.accuracy);
    }, () => { clearTimeout(timer); fail(); }, { enableHighAccuracy: true, timeout: 9000, maximumAge: 60000 });
  } catch (e) { fail(); }
}
async function addFiles(files) {
  const btn = document.getElementById("saveBtn");
  if (btn) { btn.disabled = true; btn.textContent = "Verarbeite …"; }
  for (const file of files) {
    try {
      const ex = await readExif(file);
      const blob = await downscale(file);
      draft.fotos.push({ id: newId("f"), blob, url: URL.createObjectURL(blob) });
      if (ex && !draft.exifUsed && (ex.ts || ex.lat != null)) {
        draft.exifUsed = true;
        if (ex.ts) document.getElementById("f-when").value = toLocalInput(ex.ts);
        if (ex.lat != null) setGps(ex.lat, ex.lon, "foto");
        toast(ex.lat != null ? "Aufnahmezeit und Ort aus dem Foto übernommen" : "Aufnahmezeit aus dem Foto übernommen");
      }
    } catch (e) { toast("Ein Foto ließ sich nicht lesen. Bitte JPEG oder PNG verwenden."); }
  }
  renderDraftThumbs();
  if (btn) { btn.disabled = false; btn.textContent = "Speichern"; }
}

function openCredits() {
  shell(`<div class="label">Bildnachweise</div><h2 class="t" id="sheetTitle">Artfotos</h2>
    <p class="hint" style="margin:8px 0 0">Alle Fotos stammen von Wikimedia Commons und stehen unter freien Lizenzen. Ein Tipp auf die Lizenz öffnet ihren Text.</p>
    <div class="credits">${ALL.map(s => `<div><b>${esc(s.name)}</b> · ${creditLine(s)}</div>`).join("")}</div>`);
}
function openBadges() {
  const bs = badgeState();
  const done = bs.filter(b => b.done).length;
  shell(`<div class="label">Abzeichen</div><h2 class="t" id="sheetTitle">${done} von ${bs.length} gesammelt</h2>
    <div class="badgegrid">${bs.map(b => badgeHTML(b, true)).join("")}</div>`);
}
function openLight(fid) {
  const r = document.getElementById("lightRoot");
  r.innerHTML = `<div class="lightbox" role="dialog" aria-label="Foto"><img data-foto="${fid}" alt="Dein Foto"><button type="button" data-unlight>Schließen</button></div>`;
  hydratePhotos(r);
  r.querySelector("button").focus();
}
function toast(msg) {
  const r = document.getElementById("toastRoot");
  r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => r.innerHTML = "", 2600);
}

/* ---------- Celebration for a new species or badge ---------- */
const reduceMotion = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } };
function confetti() {
  if (reduceMotion()) return;
  const c = document.createElement("canvas"); c.className = "confetti"; document.body.appendChild(c);
  const dpr = Math.min(2, devicePixelRatio || 1), W = innerWidth, H = innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  const x = c.getContext("2d"); x.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = GROUPS.map(g => cs.getPropertyValue("--c-" + g.id).trim() || "#17924f");
  const P = Array.from({ length: 140 }, () => ({ x: W / 2 + (Math.random() - .5) * 60, y: H * .42, vx: (Math.random() - .5) * 13, vy: -Math.random() * 13 - 4, r: Math.random() * 6.2, w: 5 + Math.random() * 6, h: 3 + Math.random() * 5, s: (Math.random() - .5) * .3, c: cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = performance.now();
  (function f(t) {
    const k = (t - t0) / 1800;
    x.clearRect(0, 0, W, H);
    P.forEach(p => { p.vy += .38; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.s; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.globalAlpha = Math.max(0, 1 - k * k); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore(); });
    if (k < 1) requestAnimationFrame(f); else c.remove();
  })(t0);
}
function celebrate(sp, isNew, unlocked, st) {
  if (!isNew && !unlocked.length) return;
  const r = document.getElementById("celeRoot");
  const kick = isNew ? (sp.ex ? "Bonusart entdeckt" : "Neue Art") : "Abzeichen freigeschaltet";
  r.innerHTML = `<div class="cele" data-uncele><div class="card" role="dialog" aria-label="${kick}" style="--oc:${sp.ex ? "var(--ex)" : oc(sp.gid)}">
    <div class="kick">${kick}</div>
    <div class="cimg">${PHOTOS ? `<img src="img/${sp.id}.jpg" alt="" onerror="this.remove()">` : ""}</div>
    <h3>${esc(sp.name)}</h3>
    <div class="count num">${sp.ex ? `+${st.bonus} Bonus` : `${st.seen} von ${OBSERVABLE} Arten`}</div>
    ${unlocked.map(b => `<div class="unl">${medal(b)}<div><b>${esc(b.name)}</b><span>${esc(b.desc)}</span></div></div>`).join("")}
    <button type="button" class="btn primary press" data-uncele>Weiter</button>
  </div></div>`;
  r.querySelector("button").focus();
  confetti();
}

/* ---------- Events ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab],[data-open],[data-capture],[data-back],[data-close],[data-del],[data-filter],[data-order],[data-group],[data-light],[data-unlight],[data-rmfoto],[data-uncele],#fab,#clearEx,#credits,#allBadges");
  if (!t) return;
  if (t.hasAttribute("data-uncele")) { if (t.classList.contains("cele") && e.target !== t) return; document.getElementById("celeRoot").innerHTML = ""; return; }
  if (t.hasAttribute("data-unlight")) { document.getElementById("lightRoot").innerHTML = ""; return; }
  if (t.dataset.light) return openLight(t.dataset.light);
  if (t.dataset.rmfoto) { const f = draft.fotos.splice(+t.dataset.rmfoto, 1)[0]; if (f) URL.revokeObjectURL(f.url); return renderDraftThumbs(); }
  if (t.dataset.tab) return go(t.dataset.tab);
  if (t.id === "fab") return go("species", { focusSearch: true });
  if (t.id === "credits") return openCredits();
  if (t.id === "allBadges") return openBadges();
  if (t.id === "clearEx") { state.sightings = state.sightings.filter(s => !s.beispiel); save(); render(); return toast("Beispieldaten entfernt"); }
  if (t.dataset.filter) { filter = t.dataset.filter; return render(); }
  if (t.dataset.order) { orderScroll = t.closest(".orderbar")?.scrollLeft || 0; order = t.dataset.order; render(); return window.scrollTo(0, 0); }
  if (t.dataset.group) { order = t.dataset.group; filter = "alle"; query = ""; orderScroll = 0; return go("species"); }
  if (t.dataset.open) return openSpecies(t.dataset.open);
  if (t.dataset.capture) return openForm(t.dataset.capture);
  if (t.dataset.back) return openSpecies(t.dataset.back);
  if (t.hasAttribute("data-close")) return closeSheet();
  if (t.dataset.del) {
    if (!t.classList.contains("armed")) {
      t.classList.add("armed"); t.textContent = "Wirklich löschen?";
      setTimeout(() => { if (t.isConnected) { t.classList.remove("armed"); t.textContent = "Löschen"; } }, 3000);
      return;
    }
    const s = state.sightings.find(x => x.id === t.dataset.del);
    state.sightings = state.sightings.filter(x => x.id !== t.dataset.del);
    save(); (s?.fotos || []).forEach(delPhoto); render();
    if (s) openSpecies(s.artId);
    return toast("Sichtung gelöscht");
  }
});

document.addEventListener("change", e => {
  if (e.target.id === "f-fotos" && e.target.files?.length) { const files = [...e.target.files]; e.target.value = ""; addFiles(files); }
});

document.addEventListener("submit", async e => {
  if (e.target.id !== "capture") return;
  e.preventDefault();
  const d = draft; if (!d) return;
  const when = document.getElementById("f-when").value;
  const isNew = !byArt()[d.artId];
  const before = new Set(badgeState().filter(b => b.done).map(b => b.id));
  for (const f of d.fotos) await putPhoto(f.id, f.blob);
  d.fotos.forEach(f => urlCache.set(f.id, f.url));
  state.sightings.push({
    id: newId("s"), artId: d.artId, ts: when ? new Date(when).getTime() : Date.now(),
    lat: d.lat, lon: d.lon,
    ort: document.getElementById("f-ort").value.trim(),
    notiz: document.getElementById("f-note").value.trim(),
    fotos: d.fotos.map(f => f.id),
  });
  draft = null;
  save(); render(); openSpecies(d.artId);
  const st = stats();
  const unlocked = badgeState(st).filter(b => b.done && !before.has(b.id));
  if (isNew || unlocked.length) celebrate(SPECIES[d.artId], isNew, unlocked, st);
  else toast("Sichtung gespeichert");
});

document.addEventListener("input", e => { if (e.target.id === "q") { query = e.target.value; renderSpecies(); } });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  const cr = document.getElementById("celeRoot"), lr = document.getElementById("lightRoot");
  if (cr.innerHTML) cr.innerHTML = ""; else if (lr.innerHTML) lr.innerHTML = ""; else if (sheetRoot.innerHTML) closeSheet();
});

load();
render();
</script>
